<!DOCTYPE html>
<html class="scroll-smooth dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Motis | Option 1: Particles</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "motis-orange": "#F97316",
                        "motis-orange-hover": "#C2410C",
                        "motis-dark": "#0B0F19",
                        "motis-slate": "#1E293B",
                        "motis-light": "#F8FAFC",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "heading": ["Outfit", "sans-serif"],
                    }
                }
            }
        }
</script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .delay-100 { animation-delay: 100ms !important; }
    .delay-200 { animation-delay: 200ms !important; }
    .delay-300 { animation-delay: 300ms !important; }
    .delay-400 { animation-delay: 400ms !important; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0B0F19; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #F97316; }

    .reveal-on-scroll {
        opacity: 0;
        transform: translateY(60px) scale(0.98);
        transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
    }
    .reveal-visible { opacity: 1; transform: translateY(0) scale(1); }
</style>
</head>
<body class="bg-motis-dark text-motis-light antialiased font-sans overflow-x-hidden">

<nav class="fixed top-0 w-full z-50 backdrop-blur-lg bg-motis-dark/80 border-b border-white/5 h-[80px] flex justify-between items-center px-8 md:px-16 max-w-[1600px] mx-auto left-0 right-0">
    <div class="text-2xl font-black tracking-widest text-white uppercase font-heading flex items-center">
        <span class="text-motis-orange mr-2">/</span> MOTIS (OPT 1: PARTICLES)
    </div>
</nav>

<header class="relative w-full min-h-screen flex items-center pt-[80px] overflow-hidden">
    <div class="absolute inset-0 z-0">
        <img alt="Modern Industrial Facility" class="w-full h-full object-cover opacity-20 mix-blend-luminosity grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDsAxi5gleaFzsoGHVJ8LZZU2jRJ6jT8eMAr4LIWHfyUlSkGX-xlQ1_nQbu7rdGL2Cfk0pT3vkj0Cleh7yOvkTjheeJsVCiXMr_cG9MbzKEgsCT7qlNbkyFwOUZyyvxOQzZawgsN2a0WVlozoQ-IaXYN1JNZtiWGHrS1BYHBRC6lWGUJUV2fvdFt2ekuyDrNdp6nNtUzraKKYncP-QMx8b8lVSdBd8VNQl92l4_HLUKS1lEebmZ2H_4kIDTB5yfWW77fTEOrhQNFv4"/>
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-motis-dark/40 via-motis-dark/90 to-motis-dark"></div>
    </div>

    <!-- INTERACTIVE PARTICLE MATRIX -->
    <canvas id="particleCanvas" class="absolute inset-0 z-0 opacity-40"></canvas>

    <div class="relative z-10 w-full max-w-[1400px] mx-auto px-8 md:px-16 flex flex-col justify-center">
        <div class="max-w-4xl">
            <h1 class="font-heading text-6xl md:text-[5.5rem] text-white font-black leading-[1.05] tracking-tight mb-8 reveal-on-scroll reveal-visible delay-200">
                Where <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-500">Perfection</span><br/>
                Is Not <span class="text-motis-orange">Enough.</span>
            </h1>
        </div>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('particleCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let particles = [];
            
            let mouse = { x: null, y: null };
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.x;
                mouse.y = e.y;
            });
            
            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 0.1;
                    this.speedX = Math.random() * 2 - 1;
                    this.speedY = Math.random() * 2 - 1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if(this.x > canvas.width || this.x < 0) this.speedX *= -1;
                    if(this.y > canvas.height || this.y < 0) this.speedY *= -1;
                    
                    // Mouse interaction
                    if(mouse.x) {
                        let dx = mouse.x - this.x;
                        let dy = mouse.y - this.y;
                        let distance = Math.sqrt(dx*dx + dy*dy);
                        if(distance < 150) {
                            this.x -= dx/30;
                            this.y -= dy/30;
                        }
                    }
                }
                draw() {
                    ctx.fillStyle = 'rgba(249, 115, 22, 0.8)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            for(let i=0; i<150; i++) particles.push(new Particle());
            
            function animate() {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                for(let i=0; i<particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                    for(let j=i; j<particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(249, 115, 22, ${1 - dist/100})`;
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        }
    });
</script>
</body>
</html>
