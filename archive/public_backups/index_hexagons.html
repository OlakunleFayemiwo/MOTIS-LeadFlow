<!DOCTYPE html>
<html class="scroll-smooth dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Motis | Option 2: Hexagons</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "motis-orange": "#F97316", "motis-dark": "#0B0F19", "motis-light": "#F8FAFC" },
                    fontFamily: { "sans": ["Inter", "sans-serif"], "heading": ["Outfit", "sans-serif"] }
                }
            }
        }
</script>
<style>
    .reveal-on-scroll {
        opacity: 0;
        transform: translateY(60px) scale(0.98);
        transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
    }
    .reveal-visible { opacity: 1; transform: translateY(0) scale(1); }

    /* HEXAGON GRID */
    .hexagon-grid {
        background-color: transparent;
        background-image: 
            radial-gradient(#F97316 2px, transparent 2px),
            radial-gradient(#F97316 2px, transparent 2px);
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
        opacity: 0.15;
        animation: pulseHex 6s infinite alternate ease-in-out;
    }
    @keyframes pulseHex {
        0% { opacity: 0.05; transform: scale(1) translateY(0); }
        100% { opacity: 0.25; transform: scale(1.05) translateY(-20px); }
    }
</style>
</head>
<body class="bg-motis-dark text-motis-light antialiased font-sans overflow-x-hidden">

<nav class="fixed top-0 w-full z-50 backdrop-blur-lg bg-motis-dark/80 border-b border-white/5 h-[80px] flex justify-between items-center px-8 md:px-16 max-w-[1600px] mx-auto left-0 right-0">
    <div class="text-2xl font-black tracking-widest text-white uppercase font-heading flex items-center">
        <span class="text-motis-orange mr-2">/</span> MOTIS (OPT 2: HEXAGONS)
    </div>
</nav>

<header class="relative w-full min-h-screen flex items-center pt-[80px] overflow-hidden">
    <div class="absolute inset-0 z-0">
        <img alt="Modern Industrial Facility" class="w-full h-full object-cover opacity-20 mix-blend-luminosity grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDsAxi5gleaFzsoGHVJ8LZZU2jRJ6jT8eMAr4LIWHfyUlSkGX-xlQ1_nQbu7rdGL2Cfk0pT3vkj0Cleh7yOvkTjheeJsVCiXMr_cG9MbzKEgsCT7qlNbkyFwOUZyyvxOQzZawgsN2a0WVlozoQ-IaXYN1JNZtiWGHrS1BYHBRC6lWGUJUV2fvdFt2ekuyDrNdp6nNtUzraKKYncP-QMx8b8lVSdBd8VNQl92l4_HLUKS1lEebmZ2H_4kIDTB5yfWW77fTEOrhQNFv4"/>
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-motis-dark/40 via-motis-dark/90 to-motis-dark"></div>
    </div>

    <!-- PULSATING HEXAGONS -->
    <div class="absolute inset-0 z-0 hexagon-grid pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-motis-orange/10 rounded-full blur-[150px] pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-[1400px] mx-auto px-8 md:px-16 flex flex-col justify-center">
        <div class="max-w-4xl">
            <h1 class="font-heading text-6xl md:text-[5.5rem] text-white font-black leading-[1.05] tracking-tight mb-8 reveal-on-scroll reveal-visible delay-200">
                Where <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-500">Perfection</span><br/>
                Is Not <span class="text-motis-orange">Enough.</span>
            </h1>
        </div>
    </div>
</header>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.reveal-on-scroll').forEach(el => el.classList.add('reveal-visible'));
    });
</script>
</body>
</html>
