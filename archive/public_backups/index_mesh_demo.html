<!DOCTYPE html>
<html class="scroll-smooth dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Motis | Fluid Mesh Demo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "motis-orange": "#F97316", "motis-dark": "#0B0F19", "motis-light": "#F8FAFC" },
                    fontFamily: { "sans": ["Inter", "sans-serif"], "heading": ["Outfit", "sans-serif"] }
                }
            }
        }
</script>
<style>
    /* Fluid Mesh Gradient Background */
    .mesh-bg {
        background-color: #0B0F19; /* Deep motis dark */
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
    }
    .mesh-blob-1 {
        position: absolute;
        width: 100vw;
        height: 100vw;
        background: radial-gradient(circle, rgba(249,115,22,0.15) 0%, rgba(249,115,22,0) 60%);
        top: -40%;
        left: -30%;
        border-radius: 50%;
        animation: floatBlob1 15s infinite alternate ease-in-out;
        mix-blend-mode: screen;
    }
    .mesh-blob-2 {
        position: absolute;
        width: 120vw;
        height: 120vw;
        background: radial-gradient(circle, rgba(30,41,59,0.9) 0%, rgba(30,41,59,0) 60%);
        bottom: -50%;
        right: -20%;
        border-radius: 50%;
        animation: floatBlob2 18s infinite alternate ease-in-out;
        mix-blend-mode: screen;
    }
    .mesh-blob-3 {
        position: absolute;
        width: 80vw;
        height: 80vw;
        background: radial-gradient(circle, rgba(249,115,22,0.08) 0%, rgba(249,115,22,0) 60%);
        top: 20%;
        left: 20%;
        border-radius: 50%;
        animation: floatBlob3 20s infinite alternate ease-in-out;
        mix-blend-mode: screen;
    }

    @keyframes floatBlob1 {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(15%, 15%) scale(1.1); }
    }
    @keyframes floatBlob2 {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-15%, -10%) scale(1.05); }
    }
    @keyframes floatBlob3 {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-20%, 20%) scale(0.9); }
    }

    /* Subtle Hexagon Overlay for Industrial Texture */
    .hexagon-grid {
        background-color: transparent;
        background-image: 
            radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
            radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
        opacity: 0.5;
    }

    .reveal-on-scroll {
        opacity: 0;
        transform: translateY(60px) scale(0.98);
        transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal-visible { opacity: 1; transform: translateY(0) scale(1); }
</style>
</head>
<body class="bg-motis-dark text-motis-light antialiased font-sans overflow-x-hidden">

<nav class="fixed top-0 w-full z-50 backdrop-blur-lg bg-motis-dark/80 border-b border-white/5 h-[80px] flex justify-between items-center px-8 md:px-16 max-w-[1600px] mx-auto left-0 right-0">
    <div class="text-2xl font-black tracking-widest text-white uppercase font-heading flex items-center">
        <span class="text-motis-orange mr-2">/</span> MOTIS (MESH DEMO)
    </div>
</nav>

<header class="relative w-full min-h-screen flex items-center pt-[80px] overflow-hidden">
    
    <!-- NO MORE IMAGE - PURE FLUID CSS MESH -->
    <div class="mesh-bg">
        <div class="mesh-blob-1"></div>
        <div class="mesh-blob-2"></div>
        <div class="mesh-blob-3"></div>
    </div>
    
    <!-- SUBTLE INDUSTRIAL TEXTURE ON TOP OF THE MESH -->
    <div class="absolute inset-0 z-0 hexagon-grid pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-[1400px] mx-auto px-8 md:px-16 flex flex-col justify-center">
        <div class="max-w-4xl">
            <div class="inline-flex items-center space-x-3 bg-white/5 backdrop-blur-md border border-white/10 px-5 py-2 rounded-full mb-8 text-slate-300 reveal-on-scroll reveal-visible delay-100">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-motis-orange opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-motis-orange"></span>
                </span>
                <span class="text-xs uppercase tracking-[0.2em] font-semibold text-white">Motis Industries Limited</span>
            </div>

            <h1 class="font-heading text-6xl md:text-[5.5rem] text-white font-black leading-[1.05] tracking-tight mb-8 reveal-on-scroll reveal-visible delay-200">
                Where <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-500">Perfection</span><br/>
                Is Not <span class="text-motis-orange">Enough.</span>
            </h1>
            
            <p class="text-lg md:text-2xl text-slate-400 font-light max-w-2xl leading-relaxed mb-12 reveal-on-scroll reveal-visible delay-300">
                Delivering uncompromising chemical, coating, and industrial solutions. Engineered to exceed the highest standards of modern infrastructure.
            </p>
        </div>
    </div>
</header>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.reveal-on-scroll').forEach(el => el.classList.add('reveal-visible'));
    });
</script>
</body>
</html>
