name: MOTIS Production CRM E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-auth:
    name: Production CRM authentication
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production CRM authentication test
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_CRM_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          E2E_PRODUCTION: "true"
        run: npx playwright test tests/e2e/crm-auth.spec.js --project=desktop